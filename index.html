<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#235c50"><title>Jennifer's Kitchen</title><style>:root{color-scheme:light;font-family:system-ui,-apple-system,Arial,sans-serif;color:#23332f;background:#f7f7f2}*{box-sizing:border-box}body{margin:0}header{background:#235c50;color:white;padding:22px 18px 18px}header h1{margin:0;font-size:26px}header p{margin:5px 0 0;opacity:.85}main{max-width:720px;margin:auto;padding:16px}nav{display:flex;gap:7px;overflow-x:auto;padding:3px 0 14px}button{font:inherit;cursor:pointer;color:#23332f;-webkit-text-fill-color:currentColor}button:focus-visible{outline:3px solid #e9a23b;outline-offset:2px}nav button{min-width:104px;padding:12px 9px;line-height:1.35;border:1px solid #d5dfda;background:#fff;color:#23332f;border-radius:13px}nav button.active{background:#235c50;color:#fff;-webkit-text-fill-color:#fff}.panel{background:white;border:1px solid #e1e7e2;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #142d1e08}h2{font-size:23px;margin:5px 0 8px}h3{font-size:18px;margin:0 0 12px}.tag{color:#477266;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.muted{color:#61716b}.notice{padding:12px;background:#eef5ef;border-radius:10px;margin:12px 0}.check{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #edf0ed;line-height:1.45}.check input{width:21px;height:21px;flex-shrink:0;accent-color:#235c50}.check:has(input:checked) span{text-decoration:line-through;color:#83918b}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;min-height:48px;font-weight:650;border:1px solid #cbd9d1;border-radius:12px;padding:11px;background:#fff;color:#23332f}.tabs button.active{background:#235c50;color:#fff;-webkit-text-fill-color:#fff}.video{display:inline-block;padding:12px 14px;background:#eaf2ee;color:#164b40;border-radius:10px;text-decoration:none;font-weight:600}footer{text-align:center;color:#687b72;font-size:12px;padding:22px}.small{font-size:13px}ul{padding-left:22px}li{margin:8px 0}@media(prefers-color-scheme:dark){:root{color-scheme:light}}@media(max-width:430px){header h1{font-size:24px}main{padding:12px}.panel{padding:16px}} </style></head><body><header><h1>Jennifer's Kitchen</h1><p>Family menu · 22–26 November 2026</p></header><main><div class="tabs"><button id="dinnerTab" class="active" onclick="setMode('dinner')">Dinners</button><button id="snackTab" onclick="setMode('snack')">Snacks</button></div><nav id="days"></nav><div id="content"></div></main><footer>Recipe prototype · Review quantities and timings before cooking · No personal information stored online</footer><script>
const recipes=[
{day:'Sun',date:22,title:'Beef & zucchini lasagna',servings:8,time:'About 90 min',ingredients:['1.1 kg minced beef','3 zucchini, thinly sliced','500 g dry lasagna sheets (use as needed)','1.2 kg tomato passata','1 onion, chopped','3 garlic cloves, minced','80 g butter','80 g plain flour','1 L milk','250 g grated cheese','2 tbsp olive oil','Salt, pepper, Italian herbs'],steps:['Preheat oven to 190°C (conventional) or 175°C (fan).','Slice zucchini very thinly. Chop onion and garlic.','Heat olive oil in a large pan. Cook onion 4 minutes, add garlic, then beef. Stir until browned throughout.','Add passata, herbs, salt and pepper. Simmer gently for 20 minutes.','Make béchamel: melt butter, whisk in flour for 1 minute, then slowly whisk in milk. Cook until thickened.','In a large baking dish, layer meat sauce, lasagna sheets, zucchini and béchamel. Repeat. Finish with béchamel and cheese.','Bake for 35–45 minutes, until pasta is tender and top is golden. Rest 10 minutes before cutting.','Set aside 4 portions for Monday lunchboxes. Refrigerate promptly.']},
{day:'Mon',date:23,title:'Greek lemon chicken with roast vegetables',servings:8,time:'About 75 min + optional marinating',ingredients:['1.3 kg boneless chicken thighs','1.5 kg potatoes','800 g carrots','2 lemons (juice)','4 garlic cloves','4 tbsp olive oil','2 tsp dried oregano','Salt and pepper','500 g plain Greek yogurt','1 cucumber'],steps:['Preheat oven to 200°C (conventional) or 185°C (fan).','Mix lemon juice, garlic, olive oil, oregano, salt and pepper. Coat chicken. Marinate in refrigerator if time allows.','Cut potatoes and carrots into medium pieces. Toss with a little oil and seasoning.','Spread vegetables on a large tray and roast 20 minutes.','Add chicken to the tray (use two trays if crowded). Roast another 25–35 minutes, until chicken is fully cooked (74°C in the thickest part).','Grate cucumber and squeeze out water. Mix with yogurt and a little garlic and lemon.','Serve chicken and vegetables with cucumber yogurt sauce.','Reserve 4 portions for Tuesday lunchboxes; refrigerate chicken promptly and keep sauce cold.'],video:'https://www.youtube.com/watch?v=k_U7Yj08kVs'},
{day:'Tue',date:24,title:'Mild Thai-style basil chicken & rice',servings:8,time:'About 40 min',ingredients:['1.2 kg minced chicken','750 g dry jasmine or basmati rice','700 g green beans','1 large bunch fresh basil','4 garlic cloves','1 onion','5 tbsp light soy sauce','2 tbsp honey','2 tbsp water','2 tbsp neutral oil'],steps:['Wash rice and cook according to packet instructions.','Wash and trim green beans. Steam or boil until tender but still bright green.','Finely chop onion and garlic. Wash basil leaves.','Mix soy sauce, honey and water in a small bowl.','Heat oil in a large frying pan. Cook onion for 3 minutes, then garlic for 30 seconds.','Add minced chicken and cook thoroughly, breaking up lumps. Ensure no pink chicken remains (74°C).','Add sauce and simmer for 2–3 minutes. Stir in basil just before serving. No chilli for children.','Serve with rice and green beans. Reserve 4 portions for Wednesday lunchboxes and chill promptly.']},
{day:'Wed',date:25,title:'Salmon & spinach quiche with salad',servings:8,time:'About 75 min',ingredients:['700 g boneless salmon, checked for bones','500 g spinach','350 g plain flour for pastry','175 g cold butter for pastry','About 5–7 tbsp cold water','6 eggs','350 ml cream','150 g grated cheese','350 g cherry tomatoes','1 cucumber','Salad leaves','Salt and pepper'],steps:['Preheat oven to 190°C (conventional) or 175°C (fan).','Make pastry: rub cold butter into flour until crumbly. Add cold water gradually to form a dough. Chill for 20 minutes.','Cook spinach briefly, cool, then squeeze very dry.','Roll pastry and line two medium quiche tins (or one large deep baking dish). Prick bases with a fork.','Bake pastry bases for about 10 minutes, using baking weights if available.','Cut salmon into small pieces. Whisk eggs, cream, salt and pepper.','Spread spinach and salmon in the bases. Pour over egg mixture and add grated cheese.','Bake 30–40 minutes until filling is set and salmon is fully cooked (63°C).','Serve with tomatoes, cucumber and salad. Keep 4 portions for Thursday lunchboxes, with salad packed separately.'],video:'https://www.youtube.com/watch?v=JqrUSS8fDao'},
{day:'Thu',date:26,title:'Cherry tomato & feta savory muffins',servings:4,time:'About 40 min',ingredients:['250 g plain flour','2 eggs','150 ml milk','80 ml olive oil','200 g feta, crumbled','300 g cherry tomatoes, halved','2 tsp baking powder','Pinch of salt and pepper','Salad leaves and remaining cucumber/tomatoes'],steps:['Preheat oven to 180°C (conventional) or 165°C (fan).','Line a 12-cup muffin tin with paper cases, or grease it well.','In one bowl, whisk eggs, milk and olive oil.','In another bowl, combine flour, baking powder, salt and pepper.','Mix wet and dry ingredients just until combined. Fold in feta and tomatoes.','Spoon mixture into muffin cups, filling about three-quarters full.','Bake for 20–25 minutes until golden and cooked through. Let cool briefly.','Serve with fresh green salad. No lunchbox portions needed.']}
];
const snacks=[{day:'Sun',date:22,title:'Soft apple & cinnamon cake',servings:8,time:'About 55 min',ingredients:['4 apples','200 g plain flour','100 g sugar','3 eggs','100 g butter, melted','120 ml milk','2 tsp baking powder','1 tsp cinnamon','1 tsp vanilla'],steps:['Preheat oven to 180°C (conventional) or 165°C (fan). Grease a standard cake tin.','Peel and dice apples.','Whisk eggs and sugar, then add butter, milk and vanilla.','Fold in flour, baking powder and cinnamon. Stir in apples.','Pour into tin and bake 35–45 minutes until a skewer comes out clean. Cool before slicing.']},{day:'Wed',date:25,title:'Homemade crêpes',servings:8,time:'About 40 min',ingredients:['300 g plain flour','4 eggs','600 ml milk','30 g melted butter','1 tbsp sugar','1 tsp vanilla','A little oil for pan'],steps:['Put flour and sugar in a large bowl. Make a well and add eggs.','Whisk in milk little by little until smooth. Add melted butter and vanilla.','Rest batter for 15 minutes if possible.','Heat a lightly oiled non-stick frying pan over medium heat.','Pour a small ladle of batter, swirl thinly, and cook until edges lift. Flip and cook briefly.','Cool, cover and refrigerate leftovers.'] }];
let mode='dinner',index=0;const key=(r,i,t)=>`jk-20261122-${t}-${r.date}-${i}`;
function setMode(m){mode=m;index=0;document.getElementById('dinnerTab').classList.toggle('active',m==='dinner');document.getElementById('snackTab').classList.toggle('active',m==='snack');render()}
function render(){const arr=mode==='dinner'?recipes:snacks;document.getElementById('days').innerHTML=arr.map((r,i)=>`<button class="${i===index?'active':''}" onclick="index=${i};render()">${({Sun:'Sunday',Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday'})[r.day]}<br><strong>${r.date} Nov</strong></button>`).join('');const r=arr[index];const checks=(list,t)=>list.map((s,i)=>`<label class="check"><input type="checkbox" data-k="${key(r,i,t)}"><span>${s}</span></label>`).join('');document.getElementById('content').innerHTML=`<section class="panel"><div class="tag">${r.day} ${r.date} November · ${mode==='dinner'?'Dinner':'Snack'}</div><h2>${r.title}</h2><p class="muted">${r.servings} servings · ${r.time}</p>${mode==='dinner'&&index<4?'<div class="notice">🍱 Save 4 servings for tomorrow’s school lunchboxes. Refrigerate promptly.</div>':''}</section><section class="panel"><h3>Ingredients</h3>${checks(r.ingredients,'ing')}</section><section class="panel"><h3>Step-by-step instructions</h3>${checks(r.steps,'step')}</section>${r.video?`<section class="panel"><h3>Watch the technique</h3><a class="video" target="_blank" rel="noopener noreferrer" href="${r.video}">▶ Open cooking video</a><p class="muted small">Use the written quantities above. The video may use different amounts or ingredients.</p></section>`:''}`;document.querySelectorAll('input[data-k]').forEach(el=>{try{el.checked=localStorage.getItem(el.dataset.k)==='1';el.addEventListener('change',()=>localStorage.setItem(el.dataset.k,el.checked?'1':'0'))}catch(e){}})}render();
</script></body></html>
