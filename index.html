<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#235c50"><title>Jennifer's Kitchen</title><style>:root{color-scheme:light;font-family:system-ui,-apple-system,Arial,sans-serif;color:#23332f;background:#f7f7f2}*{box-sizing:border-box}body{margin:0}header{background:#235c50;color:white;padding:22px 18px 18px}header h1{margin:0;font-size:26px}header p{margin:5px 0 0;opacity:.85}main{max-width:720px;margin:auto;padding:16px}nav{display:flex;gap:7px;overflow-x:auto;padding:3px 0 14px}button{font:inherit;cursor:pointer;color:#23332f;-webkit-text-fill-color:currentColor}button:focus-visible{outline:3px solid #e9a23b;outline-offset:2px}nav button{min-width:104px;padding:12px 9px;line-height:1.35;border:1px solid #d5dfda;background:#fff;color:#23332f;border-radius:13px}nav button.active{background:#235c50;color:#fff;-webkit-text-fill-color:#fff}.panel{background:white;border:1px solid #e1e7e2;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #142d1e08}h2{font-size:23px;margin:5px 0 8px}h3{font-size:18px;margin:0 0 12px}.tag{color:#477266;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.muted{color:#61716b}.notice{padding:12px;background:#eef5ef;border-radius:10px;margin:12px 0}.check{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #edf0ed;line-height:1.45}.check input{width:21px;height:21px;flex-shrink:0;accent-color:#235c50}.check:has(input:checked) span{text-decoration:line-through;color:#83918b}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;min-height:48px;font-weight:650;border:1px solid #cbd9d1;border-radius:12px;padding:11px;background:#fff;color:#23332f}.tabs button.active{background:#235c50;color:#fff;-webkit-text-fill-color:#fff}.video{display:inline-block;padding:12px 14px;background:#eaf2ee;color:#164b40;border-radius:10px;text-decoration:none;font-weight:600}footer{text-align:center;color:#687b72;font-size:12px;padding:22px}.small{font-size:13px}ul{padding-left:22px}li{margin:8px 0}@media(prefers-color-scheme:dark){:root{color-scheme:light}}@media(max-width:430px){header h1{font-size:24px}main{padding:12px}.panel{padding:16px}} </style></head><body><header><h1>Jennifer's Kitchen</h1><p>Family menu · 29 November – 3 December 2026</p></header><main><div class="tabs"><button id="dinnerTab" class="active" onclick="setMode('dinner')">Dinners</button><button id="snackTab" onclick="setMode('snack')">Snacks</button></div><nav id="days"></nav><div id="content"></div></main><footer>Family recipes · Written instructions take priority over reference links · Keep cooked food refrigerated</footer><script>
const recipes=[{"day":"Sun","date":29,"title":"Creamy chicken & zucchini pasta bake","servings":8,"time":"About 70 minutes","ingredients":["1.2 kg boneless chicken, diced","750 g dry short pasta (penne or fusilli)","3 medium zucchini, cut into small cubes","1 onion, finely chopped","3 garlic cloves, minced","500 ml cooking cream","250 ml milk","250 g grated mozzarella or emmental","2 tbsp olive oil","1 tsp dried mixed herbs","Salt and pepper"],"steps":["Preheat oven to 190°C conventional (175°C fan). Prepare a large baking dish.","Boil pasta in salted water for 2 minutes less than the packet instructions. Drain; keep 100 ml cooking water.","Dice zucchini and chicken into small even pieces. Wash hands and utensils after handling raw chicken.","Heat olive oil in a large pan. Cook onion 3 minutes, then garlic 30 seconds. Add chicken and cook until it begins to brown.","Add zucchini. Cook 7–9 minutes until excess liquid has mostly evaporated. Check chicken reaches 74°C internally.","Pour in cream and milk, add herbs, pepper and a little salt. Simmer gently 3–4 minutes; add pasta water if sauce is too thick.","Mix sauce with drained pasta. Transfer to baking dish and sprinkle cheese over the top.","Bake 20–25 minutes until bubbling and golden. Rest 5 minutes, then serve.","Keep 4 portions for Monday lunchboxes; cool and refrigerate promptly within 2 hours."]},{"day":"Mon","date":30,"title":"Mild beef chili con carne with basmati rice","servings":8,"time":"About 55 minutes","ingredients":["1.1 kg minced beef","3 cans kidney beans, 400 g each (drain and rinse)","2 onions, finely chopped","4 garlic cloves, minced","800 g crushed tomatoes or passata","100 g tomato paste","500 ml beef stock (start with 300 ml)","2 tsp ground cumin","2 tsp sweet paprika","2 tbsp olive oil","650 g dry basmati rice","Salt and pepper; NO chili powder"],"steps":["Peel and chop onions and garlic. Drain and rinse kidney beans.","Heat olive oil in a large heavy pot. Soften onion for 5 minutes; add garlic for 30 seconds.","Add minced beef, break it up and cook until browned completely.","Stir in cumin, sweet paprika and tomato paste. Cook for 1 minute to develop the flavour.","Add tomato passata, drained kidney beans and 300 ml stock. Stir well. Add a little more stock only if needed.","Cover and simmer gently for 25–30 minutes, stirring occasionally. Remove lid for the last 5 minutes if too watery. Season lightly. No hot chili for children.","Rinse basmati rice and cook following the packet directions; fluff with a fork.","Serve chili with rice. Ensure beef is thoroughly cooked; reserve 4 portions for Tuesday lunchboxes and refrigerate promptly."],"source":"https://www.marmiton.org/recettes/recette_chili-con-carne-facile_15415.aspx"},{"day":"Tue","date":1,"title":"Chicken, broccoli, cauliflower & potato gratin","servings":8,"time":"About 80 minutes","ingredients":["1.2 kg boneless chicken thigh or breast, diced","1 kg potatoes, peeled and diced","1 medium cauliflower (about 700 g florets)","1 large broccoli (about 500 g florets)","70 g butter","70 g plain flour","900 ml milk","250 g grated cheese","2 tbsp olive oil","Salt, pepper and a pinch of nutmeg (optional)"],"steps":["Preheat oven to 190°C conventional (175°C fan). Use one large or two medium baking dishes.","Peel and cut potatoes into 2 cm cubes. Cook in salted boiling water about 10–12 minutes until just tender, then drain thoroughly.","Cut cauliflower and broccoli into small florets. Steam or boil for 5–7 minutes until just tender; drain very well to avoid a watery gratin.","Cut raw chicken into bite-sized pieces. Heat oil in a frying pan and cook the chicken until golden and cooked through (74°C internally).","Make béchamel: melt butter on low-medium heat, stir in flour for 1 minute, then gradually whisk in milk until smooth.","Simmer béchamel for 4–6 minutes, stirring, until thick enough to coat a spoon. Season with salt, pepper and optional nutmeg.","Mix potatoes, vegetables and cooked chicken in the baking dish. Pour béchamel evenly over them. Sprinkle cheese on top.","Bake for 20–25 minutes until hot throughout and golden. Let rest 5 minutes.","Reserve 4 portions if wanted for a family lunch the next day; schools in Dubai are closed on 2–4 December for the national holiday. Refrigerate promptly."]},{"day":"Wed","date":2,"title":"Senegalese-style chicken & vegetable rice","servings":8,"time":"About 90 minutes","ingredients":["1.3 kg boneless chicken thighs, cut into large pieces (family adaptation)","650 g dry long-grain rice","4 medium carrots, sliced","2 leeks, washed well and sliced","1 green bell pepper, diced","2 onions, chopped","4 garlic cloves, minced","300 g tomato passata","1/2 small white cabbage, roughly chopped (optional)","2 tbsp olive oil","1.2 L chicken stock or water plus low-salt stock cubes; use in stages","Black pepper; salt only after tasting"],"steps":["Wash and chop all vegetables. Rinse the rice until water runs mostly clear.","Heat olive oil in a large heavy pot. Brown chicken pieces on both sides for 6–8 minutes.","Add onions and garlic, stir 2 minutes, then add green pepper and tomato passata. Cook about 8–10 minutes.","Add about 1 litre of stock. Bring to a gentle simmer. Cook chicken for 15 minutes.","Add carrots, leeks and optional cabbage. Simmer another 15–20 minutes until vegetables are tender and chicken is fully cooked (74°C internally).","Lift out chicken and vegetables with a slotted spoon. Keep warm and covered. Measure the cooking liquid left in the pot.","For 650 g dry rice, aim for roughly 950–1100 ml hot liquid in total depending on the rice packet; add hot water or remove excess liquid as needed.","Add rinsed rice to the simmering liquid, cover tightly and cook on low heat 15–20 minutes or according to rice packet. Do not stir often. If still firm, add a little hot water and continue until tender.","Fluff rice. Serve with chicken and vegetables on top. Refrigerate leftover rice quickly in shallow containers and consume within 24 hours; do not leave rice at room temperature."],"source":"https://www.marmiton.org/recettes/recette_riz-senegalais_15857.aspx"},{"day":"Thu","date":3,"title":"Turkey ham & olive savoury loaf with fresh salad","servings":4,"time":"About 65 minutes","ingredients":["150 g plain flour","4 eggs","100 ml milk","1 tbsp olive oil","100 g diced turkey ham (not pork ham)","150 g pitted green olives, sliced","75 g grated gruyère or emmental","11 g baking powder (1 packet)","300 g cherry tomatoes","1 cucumber","1 bag mixed salad leaves","1 tbsp olive oil + lemon juice for dressing","Salt and pepper"],"steps":["Preheat oven to 180°C conventional (165°C fan). Grease a loaf tin or line it with baking paper.","Slice pitted olives. Cut turkey ham into small cubes.","Put flour into a large bowl. Beat in eggs one at a time until smooth.","Stir in milk and 1 tbsp olive oil. Mix until there are no dry patches.","Fold in turkey ham, olives and grated cheese.","Add baking powder and stir gently until evenly mixed. Use only a little salt because olives and cheese are salty.","Pour batter into loaf tin. Bake about 40–45 minutes until golden and a skewer inserted in the centre comes out clean.","Leave in tin for 10 minutes, then slice. Serve with washed salad leaves, tomatoes and cucumber, lightly dressed.","Only 4 dinner portions are needed; no Friday school lunchbox."],"source":"https://www.marmiton.org/recettes/recette_cake-sale-au-jambon-et-aux-olives_18876.aspx"}];
const snacks=[{"day":"Sun","date":29,"title":"Pear & yogurt cake","servings":8,"time":"About 70–75 minutes","ingredients":["1 plain yogurt pot (125 g); keep the empty pot to measure","3 yogurt pots plain flour (about 190 g)","2 yogurt pots sugar (about 200–230 g; use less if preferred)","1/2 yogurt pot neutral oil (about 60 ml)","3 eggs","2 ripe pears, peeled and diced","1/2 packet baking powder (about 5–6 g)","A few flaked almonds (optional; omit if allergy)"],"steps":["Preheat oven to 170°C conventional (155–160°C fan). Grease a standard round cake tin.","Empty yogurt into a bowl. Keep and wash the pot to measure other ingredients.","Add sugar and eggs; whisk together, then add oil.","Fold in flour and baking powder gently until smooth.","Peel and dice pears. Fold them into the mixture; do not overmix.","Optionally sprinkle flaked almonds over the tin or cake surface. Pour batter into the prepared tin.","Bake about 45–60 minutes; begin checking at 45 minutes. A skewer should come out without wet batter.","Cool before slicing. Store covered; refrigerate if kept for more than a day in a warm kitchen."],"source":"https://www.marmiton.org/recettes/recette_gateau-au-yaourt-et-a-la-poire_21681.aspx"},{"day":"Wed","date":2,"title":"Soft vanilla & chocolate marble cake","servings":8,"time":"About 60 minutes","ingredients":["220 g plain flour","160 g sugar","3 eggs","120 g softened butter","120 ml milk","10 g baking powder","1 tsp vanilla extract","25 g unsweetened cocoa powder","2 tbsp extra milk for cocoa batter"],"steps":["Preheat oven to 175°C conventional (160°C fan). Grease and line a standard loaf tin.","Beat butter and sugar until creamy. Add eggs one by one.","Mix in 120 ml milk and vanilla.","Fold in flour and baking powder until just combined.","Divide batter between two bowls. Stir cocoa and 2 tbsp milk into one bowl.","Spoon vanilla and chocolate batters alternately into the tin. Swirl once or twice with a knife for a marble effect.","Bake 35–45 minutes, until a skewer comes out clean. If top browns too quickly, cover loosely with foil.","Cool at least 15 minutes before removing from the tin; slice when cool."]}];
let mode='dinner',index=0;const key=(r,i,t)=>`jk-20261129-${t}-${r.date}-${i}`;
function setMode(m){mode=m;index=0;document.getElementById('dinnerTab').classList.toggle('active',m==='dinner');document.getElementById('snackTab').classList.toggle('active',m==='snack');render()}
function render(){const arr=mode==='dinner'?recipes:snacks;document.getElementById('days').innerHTML=arr.map((r,i)=>`<button class="${i===index?'active':''}" onclick="index=${i};render()">${({Sun:'Sunday',Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday'})[r.day ]}<br><strong>${r.date} ${r.day==='Tue'||r.day==='Wed'||r.day==='Thu'?'Dec':'Nov'}</strong></button>`).join('');const r=arr[index];const checks=(list,t)=>list.map((s,i)=>`<label class="check"><input type="checkbox" data-k="${key(r,i,t)}"><span>${s}</span></label>`).join('');document.getElementById('content').innerHTML=`<section class="panel"><div class="tag">${r.day} ${r.date} November · ${mode==='dinner'?'Dinner':'Snack'}</div><h2>${r.title}</h2><p class="muted">${r.servings} servings · ${r.time}</p>${mode==='dinner'&&index<4?'<div class="notice">🍱 Keep 4 portions for the next day. School lunchboxes only on Monday and Tuesday; Dubai schools are closed 2–4 December.</div>':''}</section><section class="panel"><h3>Ingredients</h3>${checks(r.ingredients,'ing')}</section><section class="panel"><h3>Step-by-step instructions</h3>${checks(r.steps,'step')}</section>${r.video?`<section class="panel"><h3>Watch the technique</h3><a class="video" target="_blank" rel="noopener noreferrer" href="${r.video}">▶ Open cooking video</a><p class="muted small">Use the written quantities above. The video may use different amounts or ingredients.</p></section>`:''}`;document.querySelectorAll('input[data-k]').forEach(el=>{try{el.checked=localStorage.getItem(el.dataset.k)==='1';el.addEventListener('change',()=>localStorage.setItem(el.dataset.k,el.checked?'1':'0'))}catch(e){}})}render();
</script></body></html>
